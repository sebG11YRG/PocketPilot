
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketPilot | Savings Goals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">

        <!-- Left Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-brand">
                <div class="brand-icon">▥</div>
                <h1>PocketPilot</h1>
                <p>Take control of your money.</p>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html">
                    <span class="nav-icon">⌂</span>
                    Dashboard
                </a>

                <a href="transactions.html">
                    <span class="nav-icon">☷</span>
                    Transactions
                </a>

                <a href="goals.html" class="active"
                   aria-current="page">
                    <span class="nav-icon">◎</span>
                    Savings Goals
                </a>
            </nav>

            <div class="sidebar-bottom">
                <span>PocketPilot</span>
                <p>Your personal finance companion</p>
            </div>

        </aside>

        <!-- Savings Goals Content -->
        <main class="dashboard-main">

            <div class="dashboard-heading">
                <h2>Savings Goals</h2>
                <p>Set savings goals and track your progress.</p>
            </div>

            <!-- Create Savings Goal -->
            <section>
                <h3>Create a Savings Goal</h3>

                <form id="goal-form">

                    <label for="goal-name">Goal Name</label>
                    <input
                        type="text"
                        id="goal-name"
                        placeholder="e.g. New Laptop"
                        required
                    >

                    <label for="goal-amount">Target Amount ($)</label>
                    <input
                        type="number"
                        id="goal-amount"
                        min="0.01"
                        step="0.01"
                        required
                    >

                    <button type="submit">
                        Create Goal
                    </button>

                </form>
            </section>

            <!-- Savings Goal List -->
            <section>
                <h3>My Savings Goals</h3>

                <p id="goals-empty">
                    No savings goals created yet.
                </p>

                <div id="goals-list"></div>
            </section>

        </main>

    </div>

    <!-- Savings Goals Functionality -->
    <script src="goals.js"></script>

</body>
</html>
